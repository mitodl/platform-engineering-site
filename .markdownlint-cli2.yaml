# Rules that are off have a backlog of findings that need an author's judgment
# to fix. A count in parentheses is the number of findings in hand-written
# pages when the rule was disabled, before the page exclusions below.
# Turn a rule back on in the PR that clears its backlog.
config:
  # heading-increment (10): pages that skip from h1 to h3.
  MD001: false
  # Python-Markdown only nests a list item indented by 4 spaces.
  MD007:
    indent: 4
  # Tabs inside code blocks are part of the quoted command or output.
  MD010:
    code_blocks: false
  # line-length: paragraphs here are written one per line.
  MD013: false
  MD024:
    siblings_only: true
  # single-title (22): handbook pages that use h1 for every section.
  MD025: false
  # no-trailing-punctuation: the autofix rewords the author's heading.
  MD026: false
  # <br> breaks lines inside table cells. <div> wraps the home page grid cards.
  MD033:
    allowed_elements: [br, div]
  # no-emphasis-as-heading (34): bold lines used as labels.
  MD036: false
  # fenced-code-language (86): each block needs its language chosen by hand.
  MD040: false
  # first-line-heading (7): pages with no h1.
  MD041: false
  # no-alt-text (6): images in one post-mortem.
  MD045: false
  # code-block-style (15): indented blocks that need converting to fences.
  MD046: false
  # descriptive-link-text (30): links whose text is "here".
  MD059: false
  # table-column-style (123): the autofix reformats most tables and still
  # leaves 17 findings.
  MD060: false
ignores:
  # Generated by c4gen and byte-compared by the c4-validation drift check.
  - docs/system_architecture/**
  # These pages put a code fence under a list item with less than 4 spaces of
  # indent. Python-Markdown keeps the block inside the item only while no blank
  # line separates them, and the blanks-around-fences autofix adds that line,
  # which ends the list and restarts the numbering of the steps after it.
  # Re-indent the fences by hand before removing a page from this list.
  - docs/application_specific_guides/heroku_legacy/transition_postgres_db_to_rds.md
  - docs/application_specific_guides/openedx/proctoring/earthfile_fix.md
  - docs/application_specific_guides/openedx/proctoring/proctoring_js_architecture.md
  - docs/application_specific_guides/openedx/proctoring/proctortrack_integration_overview.md
  - docs/application_specific_guides/openedx/proctoring/workers_json_requirements.md
  - docs/application_specific_guides/openedx/prove_build_was_deployed.md
  - docs/handbook/openedx/configuring_theme_in_edX.md
  - docs/platform_services/cloud_infrastructure/pulumi_aws_classic_5_to_6_upgrade.md
  - docs/platform_services/secrets_management/faking_it_with_consul_and_vault.md
  - docs/platform_services/secrets_management/restore_vault_backups.md
  - docs/platform_services/service_discovery/consul_incantations.md
  - docs/runbooks_post_mortems/20260324_mitlearn_outage.md
