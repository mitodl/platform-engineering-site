# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Generated C4 SVGs (byte-compared by c4-validation's drift check) and
        # vendored third-party JS (hashed by update_asset_versions.py --check).
        exclude: ^docs/(system_architecture/(.+/)?_diagrams/.+\.svg|javascripts/vendor/)
      - id: end-of-file-fixer
        # Generated C4 SVGs (byte-compared by c4-validation's drift check) and
        # vendored third-party JS (hashed by update_asset_versions.py --check).
        exclude: ^docs/(system_architecture/(.+/)?_diagrams/.+\.svg|javascripts/vendor/)
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--format, parsable, -d, relaxed]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-lines
          - "(^encryptedkey:|^secure:|^secretsprovider:)"
          - --exclude-files
          - src/bridge/secrets/
          - --exclude-files
          - poetry.lock
          - --exclude-files
          - src/ol_infrastructure/applications/ocw_site/redirect_dict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: "v0.5.0"
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--extend-ignore=D1, --fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args:
          - --explicit-package-bases
          - --namespace-packages
          - --config-file=pyproject.toml
          - --warn-unused-configs
        additional_dependencies:
          - pydantic>2
          - types-PyYAML
          - types-requests
          # c4gen's CLI framework; pinned to the version in uv.lock.
          - cyclopts==4.23.0
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint
        name: actionlint
        description: Runs actionlint to lint GitHub Actions workflow files
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --min-severity=medium, --min-confidence=medium]
