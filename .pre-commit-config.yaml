# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Generated C4 SVGs (byte-compared by c4-validation's drift check) and
        # vendored third-party JS (hashed by update_asset_versions.py --check).
        exclude: ^docs/(system_architecture/(.+/)?_diagrams/.+\.svg|javascripts/vendor/)
      - id: end-of-file-fixer
        # Generated C4 SVGs (byte-compared by c4-validation's drift check) and
        # vendored third-party JS (hashed by update_asset_versions.py --check).
        exclude: ^docs/(system_architecture/(.+/)?_diagrams/.+\.svg|javascripts/vendor/)
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--format, parsable, -d, relaxed]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-lines
          - "(^encryptedkey:|^secure:|^secretsprovider:)"
          - --exclude-files
          - src/bridge/secrets/
          - --exclude-files
          - poetry.lock
          - --exclude-files
          - src/ol_infrastructure/applications/ocw_site/redirect_dict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: "v0.16.10"
    hooks:
      - id: ruff-format
        # The upstream hook now also matches markdown and would reformat
        # the Python code fences in docs/, some of which quote upstream source.
        types_or: [python, pyi]
      - id: ruff-check
        args: [--extend-ignore=D1, --fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args:
          - --explicit-package-bases
          - --namespace-packages
          - --config-file=pyproject.toml
          - --warn-unused-configs
        additional_dependencies:
          - pydantic>2
          - types-PyYAML
          - types-requests
          # c4gen's CLI framework; pinned to the version in uv.lock.
          - cyclopts==5.0.0
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
        description: Runs actionlint to lint GitHub Actions workflow files
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --min-severity=medium, --min-confidence=medium]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
  - repo: https://github.com/amperser/proselint
    rev: v0.16.0
    hooks:
      - id: proselint
        # .proselintrc.json turns off the checks that misfire on Markdown and
        # code: typography.symbols (wants curly quotes and a multiplication
        # sign in commands), dates_times.am_pm, lexical_illusions (a heading
        # repeated by its first sentence), industrial_language.chatspeak
        # (matches inside base64), annotations (TODO markers), and the
        # typography.punctuation spacing and exclamation counts.
        args: [check, --config, .proselintrc.json, --output-format, compact]
        types_or: [markdown]
        # docs/system_architecture is generated by c4gen. The files listed after
        # it had findings when the hook was added and are not checked. Remove a
        # file from the list in the PR that fixes its findings.
        exclude: |
          (?x)^(
            docs/system_architecture/.*|
            architecture_maps/README\.md|
            docs/application_specific_guides/heroku_legacy/transition_postgres_db_to_rds\.md|
            docs/application_specific_guides/jupyterhub/data_platform_notebooks\.md|
            docs/application_specific_guides/jupyterhub/jupyterhub_admin_guide\.md|
            docs/application_specific_guides/openedx/proctoring/proctortrack_integration_overview\.md|
            docs/application_specific_guides/openedx/retire_an_openedx_user\.md|
            docs/application_specific_guides/openedx/retirement_pipeline\.md|
            docs/getting_started_and_how_tos/emergency-break-glass\.md|
            docs/handbook/delivering/development-process\.md|
            docs/handbook/how-to/caching\.md|
            docs/handbook/how-to/common-web-app-guide\.md|
            docs/handbook/how-to/write-performant-apis\.md|
            docs/handbook/openedx/edx-platform-development\.md|
            docs/monitoring_observability/overview\.md|
            docs/platform_services/ci_cd/concourse_github_issues_user_guide\.md|
            docs/platform_services/ci_cd/deploying_concourse\.md|
            docs/platform_services/ci_cd/getting_started_with_concourse\.md|
            docs/platform_services/cloud_infrastructure/fastly_pulumi_state_drift\.md|
            docs/platform_services/cloud_infrastructure/import_existing_resources_with_pulumi\.md|
            docs/platform_services/cloud_infrastructure/moira_certificates\.md|
            docs/platform_services/cloud_infrastructure/publishing_to_npm\.md|
            docs/platform_services/cloud_infrastructure/pulumi_aws_classic_5_to_6_upgrade\.md|
            docs/platform_services/cloud_infrastructure/test_and_deploy_pulumi_packer_projects\.md|
            docs/platform_services/secrets_management/restore_vault_backups\.md|
            docs/platform_services/service_discovery/consul_incantations\.md|
            docs/runbooks_post_mortems/20231030_xpro_outage\.md|
            docs/runbooks_post_mortems/20260324_mitlearn_outage\.md|
            docs/runbooks_post_mortems/20260603_xpro_outage\.md|
            docs/runbooks_post_mortems/20260810_http_406_errors_on_cart_endpoints\.md|
            docs/runbooks_post_mortems/ol_production_outage_runbook\.md|
            docs/runbooks_post_mortems/oncall_runbook\.md
          )$
